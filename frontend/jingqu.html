<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>景区门票管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,sans-serif; }
  body { min-height:100vh; background:linear-gradient(145deg,#f0f7fc,#dce9f2); display:flex; justify-content:center; align-items:flex-start; padding:20px; }
  .app-wrapper { width:100%; max-width:1100px; margin:0 auto; }
  .card { background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); border-radius:32px; box-shadow:0 20px 60px rgba(0,20,40,0.10); padding:32px 34px; border:1px solid rgba(255,255,255,0.6); margin-bottom:24px; }
  .card-login { max-width:480px; margin:40px auto; }
  .btn { padding:14px 22px; border:none; border-radius:14px; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.2s ease; background:#2d6a9f; color:#fff; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(45,106,159,0.25); }
  .btn-secondary { background:#eef3f8; color:#1f2a3a; }
  .btn-danger { background:#d45c5c; }
  .btn-success { background:#2a9d8f; }
  .btn-warning { background:#e9a23b; }
  .btn-info { background:#4a90d9; }
  .btn-sm { padding:8px 16px; font-size:13px; border-radius:10px; }
  .btn-block { width:100%; }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:14px; font-weight:600; color:#1f2a3a; margin-bottom:5px; }
  .form-group input, .form-group select { width:100%; padding:12px 16px; border:2px solid #dfe7ef; border-radius:14px; font-size:15px; background:#fafcff; outline:none; transition:all 0.2s; }
  .form-group input:focus, .form-group select:focus { border-color:#2d6a9f; box-shadow:0 0 0 4px rgba(45,106,159,0.08); }
  .msg { margin-top:10px; padding:10px 16px; border-radius:12px; font-size:14px; display:none; }
  .msg.show { display:block; }
  .msg.success { background:#d4f0e8; color:#1a6a5a; }
  .msg.error { background:#f8e4e4; color:#a04040; }
  .msg.warning { background:#fdf0d8; color:#8a6a2a; }
  .msg.info { background:#e9f1f8; color:#1f3a5a; }
  .hidden { display:none !important; }
  .role-badge { display:inline-block; padding:3px 12px; border-radius:30px; font-size:12px; font-weight:600; background:#e9f1f8; color:#1f2a3a; margin-left:8px; }
  .role-badge.master { background:#1a3a5c; color:#fff; }
  .role-badge.deputy { background:#2d6a9f; color:#fff; }
  .role-badge.staff { background:#d4e2f0; color:#1f2a3a; }
  .flex-between { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .mb-12 { margin-bottom:12px; }
  .empty-state { text-align:center; padding:30px 0; color:#8a9fb0; font-size:15px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; padding:12px 14px; background:rgba(255,255,255,0.5); border-bottom:2px solid #e2e9f2; }
  td { padding:12px 14px; border-bottom:1px solid #edf2f7; }
  .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); backdrop-filter:blur(4px); display:flex; justify-content:center; align-items:center; z-index:1000; padding:20px; opacity:0; pointer-events:none; transition:opacity 0.25s ease; }
  .modal-overlay.active { opacity:1; pointer-events:all; }
  .modal-card { background:#fff; border-radius:32px; padding:28px 32px; max-width:620px; width:100%; max-height:85vh; display:flex; flex-direction:column; box-shadow:0 30px 80px rgba(0,0,0,0.2); transform:scale(0.95); transition:transform 0.25s ease; overflow-y:auto; }
  .modal-overlay.active .modal-card { transform:scale(1); }
  .modal-title { font-size:22px; font-weight:600; margin-bottom:16px; color:#1a2a3a; flex-shrink:0; }
  .btn-group { display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
  .ticket-qr-grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin:12px 0; }
  .ticket-qr-item { border:1px solid #ddd; padding:12px; border-radius:8px; background:#fafafa; text-align:center; max-width:200px; }
  .ticket-qr-item .ticket-id { font-size:14px; font-weight:bold; margin:8px 0 4px; word-break:break-all; }
  .ticket-qr-item .password { font-size:14px; color:#d45c5c; font-weight:600; }
  .ticket-qr-item .info { font-size:12px; color:#7a8fa2; }
  .ticket-list-table { width:100%; font-size:13px; }
  .ticket-list-table th { background:#f0f5fa; }
  .ticket-list-table td { padding:8px 10px; }
  .fade-in { animation:fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @media (max-width:600px) { .card { padding:24px 16px; } .modal-card { padding:20px 16px; } }
  #scanner-container { width:100%; max-width:400px; margin:0 auto; }
  #scanner-container video { width:100%; border-radius:12px; }
  @media print { body * { visibility:hidden; } .print-area, .print-area * { visibility:visible; } .print-area { position:absolute; left:0; top:0; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; } .print-area .ticket-qr-item { border:none; background:white; } .no-print { display:none; } }
  .link-btn { color:#2980b9; cursor:pointer; text-decoration:underline; background:none; border:none; font-size:14px; }
  .link-btn:hover { color:#1a5276; }
  #cameraSelectContainer { display:inline-block; margin-left:8px; }
  #cameraSelect { padding:6px 12px; border:2px solid #dfe7ef; border-radius:10px; font-size:14px; background:white; outline:none; max-width:200px; }
</style>
</head>
<body>
<div class="app-wrapper">

  <!-- 加载中 -->
  <div id="loadingPage" class="card card-login fade-in">
    <div class="empty-state">⏳ 正在验证身份 ...</div>
  </div>

  <!-- 登录页（备用） -->
  <div id="loginPage" class="card card-login fade-in" style="display:none;">
    <div class="logo" style="text-align:center;margin-bottom:20px;"><h1>🎫 景区门票管理</h1><p style="color:#5b6f82;font-size:14px;margin-top:6px;">请使用您的账号登录</p></div>
    <div class="form-group"><label>📱 账号</label><input type="text" id="loginPhone" placeholder="手机号" /></div>
    <div class="form-group"><label>🔒 密码</label><input type="password" id="loginPassword" placeholder="密码" /></div>
    <button class="btn btn-block" id="loginBtn">登录</button>
    <div id="loginMsg" class="msg" style="margin-top:14px;"></div>
    <div style="text-align:center;margin-top:14px;"><a href="/" style="color:#2d6a9f;font-size:13px;text-decoration:none;">← 返回主界面</a></div>
  </div>

  <!-- 主界面 -->
  <div id="mainPage" class="fade-in" style="display:none;">

    <!-- 头部 -->
    <div class="card">
      <div class="flex-between" style="padding-bottom:16px;border-bottom:2px solid rgba(0,0,0,0.04);">
        <div>
          <span id="displayName" style="font-weight:600;font-size:18px;">用户</span>
          <span id="displayPhone" style="font-size:14px;color:#5b6f82;">(账号)</span>
          <span class="role-badge" id="displayRole">工作人员</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-secondary btn-sm" id="backHomeBtn">🏠 返回主界面</button>
          <button class="btn btn-secondary btn-sm" id="changePwdBtn">🔑 修改密码</button>
          <button class="btn btn-secondary btn-sm" id="refreshBtn">🔄 刷新</button>
          <button class="btn btn-danger btn-sm" id="logoutBtn">🚪 退出</button>
        </div>
      </div>
    </div>

    <!-- 用户管理 -->
    <div id="userMgmtArea" class="card hidden">
      <div class="flex-between mb-12">
        <span style="font-size:18px;font-weight:600;">👥 用户管理</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-secondary btn-sm" id="exportUsersBtn">📥 导出</button>
          <button class="btn btn-success btn-sm" id="addUserBtn">➕ 添加用户</button>
        </div>
      </div>
      <div style="overflow-x:auto;"><table><thead><tr><th>#</th><th>账号</th><th>姓名</th><th>角色</th><th>操作</th></tr></thead><tbody id="userTableBody"><tr><td colspan="5" class="empty-state">暂无用户</td></tr></tbody></table></div>
      <div id="userMgmtMsg" class="msg" style="margin-top:12px;"></div>
    </div>

    <!-- 门票管理 -->
    <div class="card">
      <div class="flex-between mb-12">
        <span style="font-size:18px;font-weight:600;">🎫 门票管理</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm" id="ticketGenerateBtn">🔨 生成门票</button>
          <button class="btn btn-warning btn-sm" id="ticketVerifyBtn">📸 核销门票</button>
          <button class="btn btn-secondary btn-sm" id="ticketListBtn">📋 所有门票</button>
          <button class="btn btn-info btn-sm" id="ticketSearchBtn">🔍 查找门票</button>
        </div>
      </div>
      <div id="ticketContentArea">
        <div class="empty-state">点击上方按钮操作门票</div>
      </div>
    </div>
  </div>

  <!-- 修改密码 -->
  <div class="modal-overlay" id="changePwdModal">
    <div class="modal-card">
      <div class="modal-title">🔑 修改密码</div>
      <form id="changePwdForm">
        <div class="form-group"><label>📱 账号</label><input type="text" id="cpPhone" readonly style="background:#f0f0f0;" /></div>
        <div class="form-group"><label>当前密码</label><input type="password" id="cpOldPwd" placeholder="当前密码" /></div>
        <div class="form-group"><label>新密码</label><input type="password" id="cpNewPwd" placeholder="至少4位" minlength="4" required /></div>
        <div class="form-group"><label>确认新密码</label><input type="password" id="cpConfirmPwd" required /></div>
        <div class="form-group" id="cpMasterPwdGroup" style="display:none;">
          <label>🔑 主管理密码验证</label>
          <input type="password" id="cpMasterPwd" placeholder="请输入主管理密码" />
        </div>
        <div class="btn-group">
          <button type="button" class="btn btn-secondary" id="cpCancelBtn">取消</button>
          <button type="submit" class="btn btn-success">确认修改</button>
        </div>
      </form>
      <div id="cpMsg" class="msg"></div>
    </div>
  </div>

  <!-- 生成门票 -->
  <div class="modal-overlay" id="ticketGenerateModal">
    <div class="modal-card" style="max-width:560px;">
      <div class="modal-title">🔨 生成门票</div>
      <form id="ticketGenerateForm">
        <div class="form-group"><label>👥 入园人数</label><input type="number" id="ticketNum1" min="0" value="4" /></div>
        <div class="form-group"><label>🚌 观光车人数</label><input type="number" id="ticketNum2" min="0" value="6" /></div>
        <div class="form-group"><label>🎯 适用场景</label>
          <select id="ticketAllowedScene">
            <option value="通用">通用（所有场景均可）</option>
            <option value="入园">仅入园</option>
            <option value="观光车单程">仅观光车单程</option>
            <option value="观光车往返">仅观光车往返</option>
          </select>
        </div>
        <div class="form-group"><label>📅 有效日期</label><input type="date" id="ticketValidDate" required /></div>
        <div class="btn-group">
          <button type="button" class="btn btn-secondary" id="ticketGenCancelBtn">取消</button>
          <button type="submit" class="btn btn-success">生成</button>
        </div>
      </form>
      <div id="ticketGenMsg" class="msg" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- 核销门票 -->
  <div class="modal-overlay" id="ticketVerifyModal">
    <div class="modal-card" style="max-width:560px;">
      <div class="modal-title">📸 核销门票</div>
      <form id="ticketVerifyForm">
        <div class="form-group">
          <label>🎫 门票编号</label>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <input type="text" id="verifyId" placeholder="输入17位编号" style="flex:1;" />
            <button type="button" class="btn btn-secondary btn-sm" id="scanBtn">📷 扫码</button>
            <button type="button" class="btn btn-secondary btn-sm" id="selectCameraBtn">🎥 选择摄像机</button>
            <span id="cameraSelectContainer" style="display:none;">
              <select id="cameraSelect" onchange="onCameraSelected()"></select>
            </span>
          </div>
        </div>
        <div class="form-group"><label>🔑 密码（4位数字）</label><input type="password" id="verifyPassword" placeholder="输入密码" maxlength="4" /></div>
        <div class="form-group"><label>📍 核销场景</label>
          <select id="verifyScene">
            <option value="入园">入园</option>
            <option value="观光车单程">观光车单程</option>
            <option value="观光车往返">观光车往返</option>
          </select>
        </div>
        <div id="scanner-container" style="display:none; margin-top:10px; border:2px dashed #ccc; border-radius:12px; padding:8px; background:#fafafa;"></div>
        <div class="btn-group" style="margin-top:12px;">
          <button type="button" class="btn btn-secondary" id="ticketVerCancelBtn">取消</button>
          <button type="submit" class="btn btn-warning">核销</button>
        </div>
      </form>
      <div id="ticketVerMsg" class="msg" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- 所有门票列表 -->
  <div class="modal-overlay" id="ticketListModal">
    <div class="modal-card" style="max-width:1000px;">
      <div class="modal-title">📋 所有门票</div>
      <div id="ticketListContainer" style="max-height:400px;overflow-y:auto;">
        <div class="empty-state">暂无门票</div>
      </div>
      <div class="btn-group" style="margin-top:16px;"><button class="btn btn-secondary" id="ticketListCloseBtn">关闭</button></div>
    </div>
  </div>

  <!-- 查找门票（验证密码） -->
  <div class="modal-overlay" id="searchVerifyModal">
    <div class="modal-card" style="max-width:420px;">
      <div class="modal-title">🔒 验证身份</div>
      <p style="color:#5b6f82;margin-bottom:16px;">请输入您的登录密码以继续查找门票。</p>
      <div class="form-group"><label>当前密码</label><input type="password" id="searchVerifyPwd" placeholder="请输入密码" /></div>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" id="searchVerifyCancelBtn">取消</button>
        <button type="button" class="btn btn-success" id="searchVerifyConfirmBtn">确认</button>
      </div>
      <div id="searchVerifyMsg" class="msg"></div>
    </div>
  </div>

  <!-- 查找门票（输入编号） -->
  <div class="modal-overlay" id="searchModal">
    <div class="modal-card" style="max-width:600px;">
      <div class="modal-title">🔍 查找门票</div>
      <div class="form-group"><label>门票编号</label><input type="text" id="searchTicketId" placeholder="输入17位编号" /></div>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" id="searchCancelBtn">取消</button>
        <button type="button" class="btn btn-primary" id="searchConfirmBtn">查询</button>
      </div>
      <div id="searchResult" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- 查看密码（验证密码） -->
  <div class="modal-overlay" id="viewPwdVerifyModal">
    <div class="modal-card" style="max-width:420px;">
      <div class="modal-title">🔒 验证身份</div>
      <p style="color:#5b6f82;margin-bottom:16px;">请输入您的登录密码以查看门票密码。</p>
      <div class="form-group"><label>当前密码</label><input type="password" id="viewPwdVerifyInput" placeholder="请输入密码" /></div>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" id="viewPwdVerifyCancelBtn">取消</button>
        <button type="button" class="btn btn-success" id="viewPwdVerifyConfirmBtn">确认</button>
      </div>
      <div id="viewPwdVerifyMsg" class="msg"></div>
    </div>
  </div>

</div>

<script>
(function() {
  'use strict';

  const API_BASE = '/jingqu-api/api';
  const API_TOKEN = 'jingquguanliqi2015';

  // ===== JWT =====
  function getToken() { return localStorage.getItem('jingqu_token'); }
  function setToken(t) { localStorage.setItem('jingqu_token', t); }
  function removeToken() { localStorage.removeItem('jingqu_token'); }
  function getUser() {
    try { const r = localStorage.getItem('jingqu_user'); return r ? JSON.parse(r) : null; } catch { return null; }
  }
  function setUser(u) { localStorage.setItem('jingqu_user', JSON.stringify(u)); }
  function removeUser() { localStorage.removeItem('jingqu_user'); }

  // ===== 请求 =====
  async function apiRequest(url, options = {}) {
    const token = getToken();
    const headers = {
      'Content-Type': 'application/json',
      'X-API-Key': API_TOKEN,
      ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
      ...options.headers
    };
    const resp = await fetch(url, { ...options, headers });
    if (resp.status === 401) {
      alert('登录已过期，请重新登录');
      logout();
      return null;
    }
    if (!resp.ok) {
      const text = await resp.text();
      try { const j = JSON.parse(text); throw new Error(j.error || text); }
      catch { throw new Error(text); }
    }
    return resp.json();
  }

  // ===== 登录 =====
  async function loginWithPassword(phone, password) {
    const resp = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password })
    });
    if (!resp.ok) {
      const t = await resp.text();
      try { const j = JSON.parse(t); throw new Error(j.error || t); }
      catch { throw new Error(t); }
    }
    return resp.json();
  }

  async function loginWithSSO(phone, name, role) {
    const resp = await fetch(API_BASE + '/auth/sso', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, name, role })
    });
    if (!resp.ok) {
      const t = await resp.text();
      try { const j = JSON.parse(t); throw new Error(j.error || t); }
      catch { throw new Error(t); }
    }
    return resp.json();
  }

  function logout() {
    removeToken();
    removeUser();
    document.getElementById('mainPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'block';
    document.getElementById('loadingPage').style.display = 'none';
    if (html5QrCode) stopScanner();
  }

  // ===== 启动：优先检查 URL 参数 SSO =====
  async function boot() {
    const params = new URLSearchParams(window.location.search);
    const ssoPhone = params.get('phone');
    const ssoName = params.get('name');
    const ssoRole = params.get('role');

    // 优先：URL 参数 SSO
    if (ssoPhone) {
      try {
        const data = await loginWithSSO(ssoPhone, ssoName || '', ssoRole || 'user');
        setToken(data.token);
        setUser(data.user);
        // 清掉 URL 参数
        window.history.replaceState({}, '', window.location.pathname);
        showMain(data.user);
        return;
      } catch (e) {
        console.warn('SSO 登录失败，回退密码登录', e);
      }
    }

    // 其次：本地有 token，直接进
    const token = getToken();
    const user = getUser();
    if (token && user) {
      // 检查 token 是否有效
      try {
        const me = await apiRequest(API_BASE + '/auth/me');
        if (me) { showMain(user); return; }
      } catch (e) { /* 无效，去登录 */ }
    }

    // 最后：显示登录页
    document.getElementById('loadingPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'block';
  }

  // ===== 渲染主界面 =====
  function showMain(user) {
    document.getElementById('loadingPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';

    document.getElementById('displayName').textContent = user.name || '用户';
    document.getElementById('displayPhone').textContent = '(' + user.phone + ')';
    const roleLabel = { master: '主管理', deputy: '副管理', staff: '工作人员' }[user.role] || '工作人员';
    document.getElementById('displayRole').textContent = roleLabel;
    document.getElementById('displayRole').className = 'role-badge ' + user.role;

    const canMgmt = user.role === 'master' || user.role === 'deputy';
    document.getElementById('userMgmtArea').classList.toggle('hidden', !canMgmt);
    if (canMgmt) renderUserManagement();

    document.getElementById('ticketContentArea').innerHTML = '<div class="empty-state">点击上方按钮操作门票</div>';
  }

  // ===== 用户管理 =====
  async function renderUserManagement() {
    try {
      const data = await apiRequest(API_BASE + '/users/list');
      if (!data) return;
      const users = data.users || [];
      const tbody = document.getElementById('userTableBody');
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无用户</td></tr>';
        return;
      }
      let html = '';
      users.forEach((u, idx) => {
        const roleLabel = { master: '主管理', deputy: '副管理', staff: '工作人员' }[u.role] || '工作人员';
        html += `<tr>
          <td>${idx+1}</td>
          <td>${u.phone}</td>

  // ===== 扫码 =====
  let html5QrCode = null;
  let isScanning = false;
  let selectedDeviceId = null;

  async function getVideoDevices() {
    try {
      await navigator.mediaDevices.getUserMedia({ video: true });
      const devices = await navigator.mediaDevices.enumerateDevices();
      return devices.filter(d => d.kind === 'videoinput');
    } catch (e) { return []; }
  }

  async function populateCameraSelect() {
    const devices = await getVideoDevices();
    const select = document.getElementById('cameraSelect');
    select.innerHTML = '';
    if (devices.length === 0) {
      select.innerHTML = '<option value="">未找到摄像头</option>';
      return;
    }
    devices.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `摄像头 ${i+1}`;
      select.appendChild(opt);
    });
    if (devices.length > 0) {
      select.value = devices[0].deviceId;
      selectedDeviceId = devices[0].deviceId;
    }
    document.getElementById('cameraSelectContainer').style.display = 'inline-block';
  }

  function onCameraSelected() {
    selectedDeviceId = document.getElementById('cameraSelect').value || null;
    if (isScanning) { stopScanner(); startScanner(); }
  }

  function startScanner() {
    if (isScanning) { stopScanner().then(() => startScanner()); return; }
    const container = document.getElementById('scanner-container');
    container.style.display = 'block';
    container.innerHTML = '';
    html5QrCode = new Html5Qrcode('scanner-container');
    const videoConstraints = selectedDeviceId ? { deviceId: { exact: selectedDeviceId } } : { facingMode: 'environment' };
    html5QrCode.start(videoConstraints, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess, () => {})
      .then(() => {
        isScanning = true;
        showTicketVerMsg('📷 摄像头已开启', 'info');
      }).catch(err => {
        showTicketVerMsg('无法启动摄像头：' + err, 'error');
        container.style.display = 'none';
      });
  }

  function stopScanner() {
    return new Promise(resolve => {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode = null;
          isScanning = false;
          document.getElementById('scanner-container').style.display = 'none';
          resolve();
        }).catch(() => {
          html5QrCode = null;
          isScanning = false;
          resolve();
        });
      } else resolve();
    });
  }

  function onScanSuccess(decodedText) {
    const parts = decodedText.split('-');
    if (parts.length === 2) {
      document.getElementById('verifyId').value = parts[0];
      document.getElementById('verifyPassword').value = parts[1];
      stopScanner();
      showTicketVerMsg('扫码成功，请确认并核销', 'success');
    } else {
      showTicketVerMsg('二维码格式错误', 'error');
    }
  }

  document.getElementById('ticketListCloseBtn').addEventListener('click', function() {
    document.getElementById('ticketListModal').classList.remove('active');
  });

  document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', function(e) {
      if (e.target === this) {
        this.classList.remove('active');
        if (this.id === 'ticketVerifyModal') stopScanner();
      }
    });
  });

  document.getElementById('changePwdBtn').addEventListener('click', function() {
    const user = getUser();
    if (user) openChangePwdModal(user.phone, user.name);
    else alert('请先登录');
  });

  // 启动
  boot();
})();
</script>
</body>
</html>
