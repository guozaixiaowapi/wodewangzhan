user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 上传大文件（云空间 / 课程）
    client_max_body_size 500M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_disable "msie6";

    # 后端服务地址（本机）
    upstream app_main    { server 127.0.0.1:5000; }
    upstream app_jingqu  { server 127.0.0.1:5001; }
    upstream app_sms     { server 127.0.0.1:5002; }
    upstream app_member  { server 127.0.0.1:5003; }
    upstream app_checkin { server 127.0.0.1:5004; }
    upstream app_game    { server 127.0.0.1:5005; }

    server {
        listen       80 default_server;
        server_name  _;

        # 前端静态文件根目录
        root  /opt/apps/frontend;
        index index.html;

        # 字符集
        charset utf-8;

        # ============================================
        # 前端页面
        # ============================================

        location = / {
            try_files /index.html =404;
        }

        location = /jingqu {
            try_files /jingqu.html =404;
        }

        location = /member {
            try_files /member.html =404;
        }

        location = /checkin {
            try_files /checkin.html =404;
        }

        location = /game {
            try_files /game.html =404;
        }

        # 静态资源（图片、CSS、JS）
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # ============================================
        # 后端 API 反代
        # ============================================

        # 主界面后端
        location /main-api/ {
            proxy_pass http://app_main/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 景区管理器后端
        location /jingqu-api/ {
            proxy_pass http://app_jingqu/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 短信服务
        location /sms-api/ {
            proxy_pass http://app_sms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 会员中心后端
        location /member-api/ {
            proxy_pass http://app_member/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 签到中心后端
        location /checkin-api/ {
            proxy_pass http://app_checkin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 游戏中心后端
        location /game-api/ {
            proxy_pass http://app_game/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================
        # 云空间上传（走主界面后端）
        # ============================================
        location /main-api/cloud/upload {
            proxy_pass http://app_main/cloud/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 500M;
            proxy_request_buffering off;
        }

        # ============================================
        # 禁止访问隐藏文件
        # ============================================
        location ~ /\. {
            deny all;
        }

        # ============================================
        # 自定义错误页
        # ============================================
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}